name: khair_ummah_app
description: "Khair-e-Ummah Welfare Society (A Project of Darul Taqwa) Official Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0
  font_awesome_flutter: ^10.7.0
  shared_preferences: ^2.3.2
  share_plus: ^10.0.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/slider/
    - assets/images/gallery/
